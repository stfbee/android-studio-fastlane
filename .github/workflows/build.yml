name: Build plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Source ref to build
        type: string
        required: true
      release-tag:
        description: Expected version tag, empty for a regular build
        type: string
        default: ''
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Check version metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          ruby <<'RUBY'
          require 'json'
          require 'rexml/document'
          version = File.read('build.gradle.kts')[/^version = "([^"]+)"$/, 1]
          abort 'Missing semantic version' unless version&.match?(/\A\d+\.\d+\.\d+\z/)
          xml = REXML::Document.new(File.read('src/main/resources/META-INF/plugin.xml'))
          abort 'plugin.xml version mismatch' unless xml.elements['idea-plugin/version'].text == version
          bundle = JSON.parse(File.read('bundles/fastlane/package.json'))
          abort 'TextMate bundle version mismatch' unless bundle.fetch('version') == version
          tag = ENV.fetch('RELEASE_TAG', '')
          abort "Tag #{tag} does not match #{version}" unless tag.empty? || tag == "v#{version}"
          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') { |f| f.puts "version=#{version}" }
          RUBY

      - name: Configure SDK path
        run: echo "STUDIO_HOME=$RUNNER_TEMP/android-studio" >> "$GITHUB_ENV"

      - name: Cache Android Studio SDK
        id: studio-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.STUDIO_HOME }}
          key: android-studio-linux-2026.2.2.6-16665580

      - name: Download pinned Android Studio SDK
        if: steps.studio-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 https://edgedl.me.gvt1.com/android/studio/ide-zips/2026.2.2.6/android-studio-rabbit2-rc1-linux.tar.gz --output "$RUNNER_TEMP/studio.tar.gz"
          sha256sum --check <<EOF
          9c84a506db6dd2d8aba10a1270b954020c45ec1486b7fc46d4be2e717fa3fcb7  $RUNNER_TEMP/studio.tar.gz
          EOF
          tar -xzf "$RUNNER_TEMP/studio.tar.gz" -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/studio.tar.gz"

      - name: Use bundled Java 25
        run: |
          echo "JAVA_HOME=$STUDIO_HOME/jbr" >> "$GITHUB_ENV"
          echo "$STUDIO_HOME/jbr/bin" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Check and build plugin
        run: bash ./gradlew --no-daemon check buildPlugin verifyPluginStructure "-PstudioPath=$STUDIO_HOME" "-Dorg.gradle.java.installations.paths=$STUDIO_HOME/jbr"

      - name: Stage plugin ZIP
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mkdir -p build/release
          cp "build/distributions/fastlane-navigator-$VERSION.zip" build/release/

      - name: Read release history
        if: inputs.release-tag != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: release-history
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Prepare release notes
        if: inputs.release-tag != ''
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          ruby <<'RUBY'
          version = ENV.fetch('VERSION')
          text = File.read('release-history/CHANGELOG.md')
          notes = text[/^## #{Regexp.escape(version)}\s*\n(.*?)(?=^## |\z)/m, 1]
          abort "CHANGELOG.md has no entry for #{version}" unless notes && !notes.strip.empty?
          File.write('build/release/release-notes.md', notes.strip + "\n")
          RUBY

      - name: Upload plugin ZIP and release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plugin-${{ steps.metadata.outputs.version }}
          path: build/release/
          if-no-files-found: error
          retention-days: 14
